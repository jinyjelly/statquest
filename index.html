<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>통계 퀘스트: 보스 레이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --bg1:#1d1638; --bg2:#2d2160; --card:#fffaf0; --ink:#2a2440; --sub:#6b6585;
  --gold:#ffcc4d; --gold2:#e0a400; --red:#ff5d6c; --green:#33c26b; --blue:#4b8bff; --purple:#7b5cff;
  --line:#e6dfc8; --title:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg1)}
html,body{margin:0;min-height:100%;color:#fff;font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%,var(--bg1));padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font-family:inherit;cursor:pointer;border:0}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px;min-height:100vh;position:relative}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff5,transparent),radial-gradient(1px 1px at 85% 60%,#fff7,transparent),radial-gradient(1px 1px at 10% 70%,#fff5,transparent);z-index:-1}
h1,h2,h3,.ttl{font-family:var(--title);font-weight:400;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;font-weight:800;font-size:16px;background:var(--gold);color:#3a2a00;box-shadow:0 4px 0 var(--gold2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
.btn.sec{background:#ffffff1f;color:#fff;box-shadow:0 4px 0 #0005}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #b8323f}
.btn:disabled{opacity:.45;pointer-events:none}
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0004}
/* 타이틀 */
.title{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:6vh}
.logo{font-family:var(--title);font-size:44px;line-height:1.05;color:var(--gold);text-shadow:0 4px 0 #8a5a00,0 8px 20px #000a}
.logo small{display:block;font-size:22px;color:#fff;text-shadow:0 3px 0 #5b3fd0}
.title .boss-row{display:flex;gap:4px;margin:6px 0}
.title .boss-row svg{width:76px;height:70px;animation:bob 2.4s ease-in-out infinite}
.title .boss-row svg:nth-child(2){animation-delay:.3s}.title .boss-row svg:nth-child(3){animation-delay:.6s}.title .boss-row svg:nth-child(4){animation-delay:.9s}
@keyframes bob{50%{transform:translateY(-6px)}}
.title input{width:100%;font:700 18px var(--body);padding:12px 14px;border-radius:12px;border:3px solid var(--purple);outline:none;color:var(--ink)}
.title .sub{color:#cfc8f0;font-size:14px;line-height:1.6}
/* 마을 */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .av{width:48px;height:48px;border-radius:14px;background:#ffffff1a;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.hud .who{flex:1;min-width:0}
.hud .nm{font-family:var(--title);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:10px;background:#0006;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;transition:width .4s}
.expbar i{background:linear-gradient(90deg,#5ad0ff,#4b8bff)}
.hud .exp{font-size:11px;color:#cfc8f0;margin-top:3px}
.coin{background:#0005;border-radius:20px;padding:6px 12px;font-weight:800;color:var(--gold);white-space:nowrap}
.mission{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mission .tx{flex:1;font-size:14px}
.mission .tx b{font-family:var(--title);font-weight:400;font-size:17px}
.mission .bar{background:#e8e1cc;margin-top:6px}.mission .bar i{background:var(--green)}
.stages{display:flex;flex-direction:column;gap:10px}
.stage{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:10px 12px;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:0 5px 0 #0004;position:relative}
.stage svg{width:72px;height:66px;flex:none}
.stage .info{flex:1;min-width:0}
.stage .u{font-size:12px;font-weight:800;color:var(--purple)}
.stage .n{font-family:var(--title);font-size:20px}
.stage .d{font-size:12px;color:var(--sub);margin-top:2px}
.stage .tag{font-size:12px;font-weight:800;padding:4px 8px;border-radius:10px;background:var(--gold);color:#3a2a00;white-space:nowrap}
.stage .tag.done{background:var(--green);color:#fff}
.stage.lock{filter:grayscale(1);opacity:.55}
.stage.lock .tag{background:#999;color:#fff}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.menu button{background:#ffffff17;color:#fff;border-radius:14px;padding:12px 4px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.menu button span{font-size:24px}
/* 전투 */
.btop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.btop .back{background:#ffffff1a;color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.btop .st{font-family:var(--title);font-size:17px;color:#d9d2ff}
.combo{font-family:var(--title);font-size:18px;color:var(--gold);min-width:80px;text-align:right}
.combo.hot{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.35)}}
.arena{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 0 6px}
.arena .bsvg{width:150px;height:135px;transition:filter .2s}
.arena .bsvg.idle{animation:bob 2.2s ease-in-out infinite}
.arena .bsvg.hit{animation:hit .4s}
.arena .bsvg.dead{animation:die .9s forwards}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes die{to{transform:scale(.2) rotate(30deg);opacity:0}}
.bname{font-family:var(--title);font-size:18px;margin-top:2px}
.hpwrap{width:100%;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800}
.hpwrap .bar{flex:1;height:14px;border:2px solid #0008}
.bosshp i{background:linear-gradient(90deg,#ff5d6c,#ff9a5d)}
.myhp i{background:linear-gradient(90deg,#33c26b,#8be04a)}
.myhp i.low{background:linear-gradient(90deg,#ff5d6c,#ffa04a)}
.pl{position:relative;display:flex;align-items:center;gap:8px;margin:8px 0}
.pl .me{font-size:24px}
.hintb{background:#ffffff1f;color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.dmg{position:absolute;left:50%;top:40px;font-family:var(--title);font-size:34px;color:#fff;text-shadow:0 3px 0 #c0392b,0 0 12px #000;pointer-events:none;animation:up 1s forwards;white-space:nowrap}
.dmg.crit{font-size:42px;color:var(--gold);text-shadow:0 3px 0 #8a5a00,0 0 16px #f80}
.dmg.ouch{top:auto;bottom:14px;left:30%;color:#ff8d98;text-shadow:0 3px 0 #600,0 0 10px #000}
@keyframes up{0%{transform:translate(-50%,10px) scale(.6);opacity:0}20%{transform:translate(-50%,0) scale(1.1);opacity:1}100%{transform:translate(-50%,-50px);opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{position:fixed;inset:0;background:#ff304060;pointer-events:none;animation:fl .4s forwards;z-index:50}
@keyframes fl{to{opacity:0}}
.qcard{padding:12px 14px 14px}
.timer{height:8px;border-radius:8px;background:#e8e1cc;overflow:hidden;margin-bottom:10px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#ffd84a);width:100%}
.timer i.low{background:linear-gradient(90deg,#ff5d6c,#ff8a5d)}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px}
.qtext{font-size:17px;font-weight:700;line-height:1.65;word-break:keep-all}
.data{margin:8px 0 2px;padding:8px 10px;background:#f1ecdc;border-radius:10px;font-size:17px;letter-spacing:.02em;text-align:center;font-weight:800}
.tb{border-collapse:collapse;margin:8px auto 2px;font-size:14px;background:#fff}
.tb th,.tb td{border:1.5px solid #c9c0a4;padding:5px 8px;text-align:center}
.tb th{background:#f1ecdc}
.fig{display:block;width:100%;max-width:300px;margin:8px auto 0;background:#fff;border-radius:10px;border:1.5px solid var(--line)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:14px;background:#fff;border:3px solid #ddd3b5;color:var(--ink);font-size:16px;font-weight:700;line-height:1.5;box-shadow:0 3px 0 #ddd3b5;word-break:keep-all}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:active{transform:translateY(2px)}
.opt.ok{border-color:var(--green);background:#e2f8e8;box-shadow:0 3px 0 var(--green)}
.opt.ok b{background:var(--green)}
.opt.ng{border-color:var(--red);background:#fde3e5;box-shadow:0 3px 0 var(--red)}
.opt.ng b{background:var(--red)}
.opt.gone{opacity:.25;pointer-events:none}
.done .opt:not(.ok):not(.ng){opacity:.5}
.fb{margin-top:12px;border-top:2px dashed var(--line);padding-top:10px;font-size:15px;line-height:1.7}
.fb .r{font-family:var(--title);font-size:22px}
.fb .r.good{color:var(--green)}.fb .r.bad{color:var(--red)}
.fb .ex{color:#4a4560;margin-top:4px}
.fb .btn{width:100%;margin-top:10px}
.rt{white-space:nowrap}.rt span{text-decoration:overline;text-decoration-thickness:2px}
/* 모달/패널 */
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.modal .card{width:100%;max-width:440px;max-height:88vh;overflow:auto;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h2{font-size:24px;text-align:center;margin-bottom:8px}
.modal p{line-height:1.6;margin:6px 0}
.row2{display:flex;gap:8px;margin-top:12px}.row2 .btn{flex:1}
.cards{display:grid;gap:10px;margin-top:10px}
.ucard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fff;border:3px solid var(--purple);text-align:left;color:var(--ink);box-shadow:0 4px 0 #5b3fd0}
.ucard .ic{font-size:30px}
.ucard b{font-family:var(--title);font-weight:400;font-size:18px;display:block}
.ucard span{font-size:13px;color:var(--sub)}
.page h2{font-size:26px;margin:4px 0 12px}
.page .back{background:#ffffff1a;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pet{background:var(--card);color:var(--ink);border-radius:14px;padding:10px 6px;text-align:center;border:3px solid transparent}
.pet .e{font-size:38px}
.pet .n{font-weight:800;font-size:13px}
.pet .r{font-size:11px;font-weight:800}
.pet .fx{font-size:11px;color:var(--sub)}
.pet.no{opacity:.4;filter:grayscale(1)}
.pet.on{border-color:var(--gold);box-shadow:0 0 0 3px #ffcc4d55}
.r-일반{color:#6b6585}.r-희귀{color:#4b8bff}.r-전설{color:#e08a00}
.egg{font-size:90px;display:inline-block;animation:egg .9s ease-in-out}
@keyframes egg{20%{transform:rotate(-15deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-20deg)}80%{transform:rotate(20deg) scale(1.15)}}
.reveal{font-size:90px;display:inline-block;animation:pop .4s}
.badge{background:var(--card);color:var(--ink);border-radius:14px;padding:10px 6px;text-align:center}
.badge .e{font-size:34px}.badge .n{font-weight:800;font-size:13px}.badge .d{font-size:11px;color:var(--sub)}
.badge.no{opacity:.35;filter:grayscale(1)}
.note{margin-bottom:10px}
.note .u{font-size:12px;font-weight:800;color:var(--purple)}
.note .a{margin-top:6px;font-weight:800;color:var(--green)}
.note .ex{font-size:14px;color:#4a4560;line-height:1.6;margin-top:4px}
.stat{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:15px}
.stat b{text-align:right}
textarea{width:100%;min-height:110px;font:13px/1.4 monospace;border-radius:10px;border:2px solid var(--line);padding:8px;word-break:break-all;color:var(--ink)}
#toasts{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#000d;color:#fff;padding:10px 18px;border-radius:30px;font-weight:800;z-index:60;animation:pop .2s;max-width:90vw;text-align:center}
.intro{font-size:14px;background:#0005;border-radius:12px;padding:8px 12px;margin:6px 0;color:#efeaff;text-align:center;line-height:1.5}
.small{font-size:12px;color:#cfc8f0;text-align:center;margin-top:16px;line-height:1.6}
.gb{display:flex;flex-direction:column;gap:14px}
.screen{position:relative;border-radius:14px;overflow:hidden;border:4px solid #0009;box-shadow:0 6px 0 #0005;background:#000;touch-action:none}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.whud{position:absolute;left:6px;right:6px;top:6px;display:flex;justify-content:space-between;pointer-events:none}
.whud span{background:#000a;border-radius:10px;padding:3px 9px;font-size:13px;font-weight:800}
.whud b{color:var(--gold)}
.zone{position:absolute;left:50%;top:36px;transform:translateX(-50%);background:#000c;padding:6px 14px;border-radius:20px;font-family:var(--title);font-size:16px;white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none}
.zone.show{opacity:1}
.dlg{position:absolute;left:6px;right:6px;bottom:6px;background:var(--card);color:var(--ink);border:4px solid #3a3058;border-radius:10px;padding:12px 14px 14px;font-size:15px;font-weight:700;line-height:1.6;min-height:70px;cursor:pointer}
.dlg .who{position:absolute;top:-14px;left:10px;background:var(--purple);color:#fff;font-size:12px;padding:2px 10px;border-radius:10px}
.dlg .nxt{position:absolute;right:10px;bottom:2px;color:var(--red);animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.screen.enc::after{content:'';position:absolute;inset:0;background:#fff;animation:enc .75s forwards}
@keyframes enc{0%,40%,80%{opacity:1}20%,60%{opacity:0}100%{opacity:1;background:#000}}
.pad{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;user-select:none;-webkit-user-select:none;touch-action:none;padding:0 4px}
.dpad{position:relative;width:144px;height:144px}
.dpad button{position:absolute;width:48px;height:48px;background:#3a3456;color:#aaa;font-size:18px;box-shadow:0 4px 0 #0007;touch-action:none}
.dpad .u{left:48px;top:0;border-radius:8px 8px 0 0}.dpad .d{left:48px;bottom:0;border-radius:0 0 8px 8px}.dpad .l{left:0;top:48px;border-radius:8px 0 0 8px}.dpad .r{right:0;top:48px;border-radius:0 8px 8px 0}
.dpad i{position:absolute;left:48px;top:48px;width:48px;height:48px;background:#3a3456}
.dpad button.on,.ab button.on,.mid .pill.on{transform:translateY(2px);box-shadow:0 1px 0 #0007;color:#fff}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#cfc8f0;text-align:center}
.mid .pill{width:56px;height:18px;border-radius:10px;background:#6e6a8e;box-shadow:0 3px 0 #0006}
.ab{display:flex;gap:12px;transform:rotate(-18deg)}
.ab div:first-child{margin-top:36px}
.ab button{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a9a,#e0335a 60%,#a01d3e);color:#fff;font-family:var(--title);font-size:24px;box-shadow:0 5px 0 #6a1028;touch-action:none}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mlist button{background:#f1ecdc;color:var(--ink);border-radius:12px;padding:12px 6px;font-weight:800;font-size:14px}
@media (max-width:370px){.dpad{width:126px;height:126px}.dpad button,.dpad i{width:42px;height:42px}.dpad .u,.dpad .d,.dpad i{left:42px}.dpad .l,.dpad .r,.dpad i{top:42px}.ab button{width:54px;height:54px}}
.arena2{position:sticky;top:0;z-index:5;height:228px;border-radius:16px;overflow:hidden;border:3px solid #0008;box-shadow:0 6px 14px #0006;margin:6px 0 10px}
.arena2 .ebox,.arena2 .pbox{position:absolute;background:#fffaf0ee;color:var(--ink);border-radius:10px;padding:5px 9px 4px;border:2px solid #3a3058;z-index:3}
.arena2 .ebox{left:8px;top:8px;width:52%}
.arena2 .pbox{right:8px;bottom:8px;width:52%}
.arena2 .bn{font-family:var(--title);font-size:15px;display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden}
.arena2 .bn small{font-family:var(--body);font-weight:800;font-size:11px;color:var(--purple)}
.arena2 .hpwrap{font-size:10px;color:#d79a18}
.arena2 .hpwrap .bar{height:9px;border-width:1.5px}
.arena2 .hpn{text-align:right;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.arena2 .combo{margin-left:auto;font-size:13px;min-width:0;color:#e0335a}
.foe{position:absolute;right:5%;top:14px;width:132px;height:120px}
.foe .bsvg{position:absolute;inset:0;width:100%;height:100%}
.foe .bsvg svg{width:100%;height:100%}
.plat{position:absolute;left:50%;bottom:-6px;width:120%;height:26px;transform:translateX(-50%);border-radius:50%;background:#0003;box-shadow:inset 0 -4px 0 #0002}
.hero{position:absolute;left:9%;bottom:16px;width:78px;height:78px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hero .plat{width:140%;bottom:-8px}
.hpet{position:absolute;right:-26px;bottom:2px;font-size:28px}
.banner{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.8);background:#000c;color:#fff;padding:6px 14px;border-radius:20px;font-weight:800;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;z-index:6;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner.crit{background:linear-gradient(90deg,#ff7a1a,#ffcc4d);color:#3a1a00}
.banner.enemy{background:#7a1020e6}
.banner .cb{background:#e0335a;border-radius:8px;padding:0 6px;margin-left:4px}
.orb{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:italic 900 19px serif;color:#fff;background:radial-gradient(circle at 35% 35%,#fff,#7ad7ff 35%,#2a7bff 75%);box-shadow:0 0 14px 4px #7ad7ffaa;z-index:4;pointer-events:none}
.orb.crit{width:46px;height:46px;font-size:24px;background:radial-gradient(circle at 35% 35%,#fff,#ffe14d 35%,#ff8a1a 75%);box-shadow:0 0 22px 8px #ffcc4daa;color:#5a2a00}
.orb.dark{background:radial-gradient(circle at 35% 35%,#ff9aa8,#c0203a 45%,#3a0a20 80%);box-shadow:0 0 14px 4px #ff3a5a99;font:900 16px sans-serif}
.ring{position:absolute;width:60px;height:60px;border-radius:50%;border:5px solid #7ad7ff;z-index:4;pointer-events:none}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;z-index:4;pointer-events:none}
.arena2 .dmg{position:absolute;z-index:7;-webkit-text-stroke:1.5px #7a1020}.arena2 .dmg.ouch{bottom:auto}
.flash.white{background:#ffffff90}

<body>
<div class="stars"></div>
<div id="app"></div>

<script>
// =====================================================================
//  문제 은행: 중학교 3학년 통계 (대푯값 / 산포도 / 상관관계)
//  숫자는 매번 랜덤으로 바뀌고, 정답·오답·해설이 자동으로 만들어진다.
// =====================================================================
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sum = a => a.reduce((x, y) => x + y, 0);
const fmt = n => { if (typeof n === 'string') return n; const s = Number.isInteger(n) ? String(n) : String(+n.toFixed(2)); return s.replace('-', '−'); };
const list = a => a.map(fmt).join(', ');
const sq = x => x < 0 ? `(${fmt(x)})²` : `${fmt(x)}²`;
function median(a) { const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; }
function josa(w, a, b) { const c = w.charCodeAt(w.length - 1); if (c < 0xac00 || c > 0xd7a3) return a; return (c - 0xac00) % 28 ? a : b; }
function sqf(n) { let a = 1, b = n; for (let k = 2; k * k <= b; k++) while (b % (k * k) === 0) { b /= k * k; a *= k; } return [a, b]; }
const RT = (a, b) => b === 1 ? String(a) : `${a === 1 ? '' : a}<span class="rt">√<span>${b}</span></span>`;
const sqrtStr = n => { const [a, b] = sqf(n); return RT(a, b); };
function table(head, rows) { return `<table class="tb"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`; }

// 보기 만들기: 정답 + 서로 다른 오답 최대 3개
function mk(q, a, ds, ex, fig) {
  const opts = [a];
  for (const d of ds) { if (opts.length >= 4) break; if (d != null && d !== '' && !opts.includes(d)) opts.push(d); }
  return { q, a, opts: shuffle(opts), ex, fig: fig || '' };
}
function mkN(q, ans, cands, ex, o = {}) {
  const u = o.unit || '', f = v => fmt(v) + u;
  const pool = cands.concat([ans + 1, ans - 1, ans + 2, ans - 2, ans + 3, ans * 2, ans + 5]);
  const ds = [];
  for (const c of pool) {
    if (ds.length >= 3) break;
    if (!Number.isFinite(c) || Math.abs(c - ans) < 1e-9 || ds.some(d => Math.abs(d - c) < 1e-9)) continue;
    if (o.nonneg && c < 0) continue;
    ds.push(+c.toFixed(2));
  }
  return mk(q, f(ans), ds.map(f), ex, o.fig);
}
function tf(trues, falses, ex) {
  if (Math.random() < .5) return mk('다음 중 옳은 것은?', pick(trues), shuffle(falses.slice()).slice(0, 3), ex);
  return mk('다음 중 옳지 <u>않은</u> 것은?', pick(falses), shuffle(trues.slice()).slice(0, 3), ex);
}

const CTX = [
  { t: '학생 {n}명의 하루 운동 시간', u: '분', lo: 10, hi: 60 },
  { t: '학생 {n}명의 줄넘기 기록', u: '회', lo: 20, hi: 80 },
  { t: '학생 {n}명의 수행평가 점수', u: '점', lo: 5, hi: 20 },
  { t: '{n}일 동안의 최고 기온', u: '°C', lo: 12, hi: 30 },
  { t: '학생 {n}명의 일주일 독서 시간', u: '시간', lo: 1, hi: 12 },
  { t: '학생 {n}명이 가진 연필 수', u: '자루', lo: 1, hi: 15 },
  { t: '학생 {n}명의 턱걸이 기록', u: '회', lo: 0, hi: 15 },
];
const ctxQ = (c, n, ask) => { const t = c.t.replace('{n}', n); return `${t}${josa(t, '이', '가')} 다음과 같을 때, ${ask}`; };
const rnd = (c, n) => Array.from({ length: n }, () => R(c.lo, c.hi));

const GEN = { 1: [], 2: [], 3: [] };

// ---------------- Ⅰ. 대푯값 ----------------
GEN[1].push(() => { // 평균
  const c = pick(CTX), n = R(5, 7); let d; do d = rnd(c, n); while (sum(d) % n);
  const m = sum(d) / n;
  return mkN(`${ctxQ(c, n, '평균은?')}<div class="data">${list(d)} (${c.u})</div>`, m, [median(d), Math.round(sum(d) / (n - 1)), m + 2, m - 2],
    `평균 = (변량의 총합) ÷ (변량의 개수) = ${sum(d)} ÷ ${n} = ${m}`, { unit: c.u, nonneg: 1 });
});
GEN[1].push(() => { // 중앙값 (홀수 개)
  const c = pick(CTX), n = pick([5, 7]), mid = (n - 1) / 2; let d; do d = rnd(c, n); while (d[mid] === median(d) || new Set(d).size < n - 1);
  const s = [...d].sort((a, b) => a - b), md = median(d);
  return mkN(`${ctxQ(c, n, '중앙값은?')}<div class="data">${list(d)} (${c.u})</div>`, md, [d[mid], +(sum(d) / n).toFixed(1), s[0], s[n - 1]],
    `크기순으로 나열하면 ${list(s)}. 한가운데(${mid + 1}번째) 값이 중앙값 → ${md}. 처음 나열된 순서 그대로 가운데 값을 고르면 안 돼!`, { unit: c.u, nonneg: 1 });
});
GEN[1].push(() => { // 중앙값 (짝수 개)
  const c = pick(CTX), n = pick([6, 8]); let d, s; do { d = rnd(c, n); s = [...d].sort((a, b) => a - b); } while (s[n / 2 - 1] === s[n / 2]);
  const a = s[n / 2 - 1], b = s[n / 2], md = (a + b) / 2;
  return mkN(`${ctxQ(c, n, '중앙값은?')}<div class="data">${list(d)} (${c.u})</div>`, md, [a, b, (d[n / 2 - 1] + d[n / 2]) / 2, +(sum(d) / n).toFixed(1)],
    `크기순으로 나열하면 ${list(s)}. 개수가 ${n}개(짝수)라서 가운데 두 값 ${a}, ${b}의 평균이 중앙값: (${a} + ${b}) ÷ 2 = ${fmt(md)}`, { unit: c.u, nonneg: 1 });
});
GEN[1].push(() => { // 최빈값
  const c = pick(CTX), n = R(6, 8), v = R(c.lo, c.hi);
  const pool = shuffle(Array.from({ length: c.hi - c.lo + 1 }, (_, i) => c.lo + i).filter(x => x !== v));
  const others = pool.slice(0, n - 3); const two = others[0]; if (others.length >= 2) others[others.length - 1] = two;
  const d = shuffle([v, v, v, ...others]);
  return mkN(`${ctxQ(c, n, '최빈값은?')}<div class="data">${list(d)} (${c.u})</div>`, v, [two, median(d), Math.max(...d), Math.round(sum(d) / n)],
    `가장 많이 나타난 값이 최빈값! ${v}: 3번, ${two}: 2번 나타나니까 최빈값은 ${v}`, { unit: c.u, nonneg: 1 });
});
GEN[1].push(() => { // 평균이 주어질 때 x
  const c = pick(CTX), n = R(4, 6); let d, M, x;
  do { d = rnd(c, n - 1); M = R(c.lo + 2, c.hi - 2); x = M * n - sum(d); } while (x < c.lo || x > c.hi);
  return mkN(`${n}개의 변량 ${list(d)}, <i>x</i>의 평균이 ${M}일 때, <i>x</i>의 값은?`, x, [M, M * (n - 1) - sum(d), x + n, x - n],
    `(총합) = (평균) × (개수) = ${M} × ${n} = ${M * n}. 따라서 x = ${M * n} − (${d.join(' + ')}) = ${M * n} − ${sum(d)} = ${x}`, { nonneg: 1 });
});
GEN[1].push(() => { // 적절한 대푯값 고르기
  const out = R(90, 150), small = shuffle([R(1, 3), R(4, 6), R(7, 9), R(10, 12)]);
  const sc = pick([
    ['자료에 극단적으로 크거나 작은 값이 있을 때, 자료 전체를 대표하기에 가장 적절한 대푯값은?', '중앙값', '극단적인 값이 있으면 평균이 그 값 쪽으로 크게 끌려가. 중앙값은 크기순으로 가운데 값이라 영향을 덜 받아.'],
    [`다음 자료의 대푯값으로 가장 적절한 것은?<div class="data">${list([...small, out])}</div>`, '중앙값', `${out}처럼 혼자 지나치게 큰 값 때문에 평균이 ${fmt(sum([...small, out]) / 5)}까지 부풀려져. 이럴 땐 중앙값(${median([...small, out])})이 더 잘 대표해.`],
    ['신발 가게에서 다음 달에 가장 많이 준비해야 할 신발 크기를 정할 때 가장 적절한 대푯값은?', '최빈값', '가장 많이 팔린(가장 자주 나타난) 크기가 필요하니까 최빈값!'],
    ['반 학생들이 가장 좋아하는 과일을 조사한 자료의 대푯값으로 적절한 것은?', '최빈값', '과일 이름처럼 숫자가 아닌 자료는 평균이나 중앙값을 구할 수 없어. 최빈값만 가능해!'],
    ['극단적인 값이 없는 자료에서 모든 변량의 정보를 반영하여 가장 많이 쓰이는 대푯값은?', '평균', '평균은 모든 변량을 다 더해서 구하니까 자료 전체의 정보를 반영해. 극단값이 없으면 평균을 가장 많이 써.'],
  ]);
  return mk(sc[0], sc[1], ['평균', '중앙값', '최빈값', '분산'].filter(x => x !== sc[1]), sc[2]);
});
GEN[1].push(() => tf(
  ['최빈값은 2개 이상일 수도 있다.', '중앙값은 변량을 크기순으로 나열했을 때 한가운데 있는 값이다.', '변량의 개수가 짝수이면 중앙값은 가운데 두 값의 평균이다.', '평균은 극단적인 값의 영향을 많이 받는다.', '최빈값은 숫자가 아닌 자료에도 쓸 수 있다.', '대푯값에는 평균, 중앙값, 최빈값 등이 있다.'],
  ['중앙값은 극단적인 값의 영향을 가장 크게 받는다.', '최빈값은 항상 하나뿐이다.', '중앙값은 나열된 순서 그대로에서 가운데 값이다.', '평균은 항상 자료에 있는 값 중 하나이다.', '변량의 개수가 짝수이면 중앙값은 구할 수 없다.', '분산은 대푯값의 하나이다.'],
  '평균: 총합 ÷ 개수 (극단값에 약함) / 중앙값: 크기순 가운데 값 (짝수 개면 가운데 두 값의 평균) / 최빈값: 가장 많이 나타난 값 (여러 개일 수도 있음). 분산은 대푯값이 아니라 산포도야!'));
GEN[1].push(() => { // 도수분포표에서 평균
  const v = [1, 2, 3, 4, 5]; let f; do f = v.map(() => R(0, 6)); while (sum(f) < 6 || sum(v.map((x, i) => x * f[i])) % sum(f));
  const N = sum(f), tot = sum(v.map((x, i) => x * f[i])), m = tot / N;
  return mkN(`어느 반 학생들이 한 달 동안 읽은 책의 수를 조사한 표이다. 평균은 몇 권인가?${table(['책(권)', ...v, '합계'], [['학생 수(명)', ...f, N]])}`, m, [median(v) === m ? m + 2 : median(v), +(N / 5).toFixed(1), m + 1, m - 1],
    `(책 수 × 학생 수)의 합 ÷ 전체 학생 수 = (${v.map((x, i) => `${x}×${f[i]}`).join(' + ')}) ÷ ${N} = ${tot} ÷ ${N} = ${fmt(m)}`, { unit: '권', nonneg: 1 });
});

// ---------------- Ⅱ. 산포도 ----------------
const CTX2 = [
  { t: '과학 점수', u: '점', M: [60, 85] }, { t: '줄넘기 기록', u: '회', M: [30, 70] },
  { t: '일주일 독서 시간', u: '시간', M: [8, 15] }, { t: '키', u: 'cm', M: [150, 168] }, { t: '턱걸이 기록', u: '회', M: [8, 14] },
];
function devset(n, r) {
  for (let t = 0; t < 5000; t++) {
    const d = Array.from({ length: n - 1 }, () => R(-r, r)), last = -sum(d);
    if (Math.abs(last) > r + 1) continue; d.push(last);
    const s2 = sum(d.map(x => x * x));
    if (s2 > 0 && s2 % n === 0 && new Set(d).size >= 3) return shuffle(d);
  }
  return shuffle({ 4: [-3, -1, 1, 3], 5: [-2, -1, 0, 1, 2], 6: [-2, -2, -1, 1, 2, 2] }[n]);
}
const NAMES = ['A', 'B', 'C', 'D', 'E', 'F'];
function dataSet(n) { const c = pick(CTX2), dv = devset(n, 4), M = R(c.M[0], c.M[1]); return { c, dv, M, d: dv.map(x => M + x) }; }
const dTable = (n, label, vals) => table(['학생', ...NAMES.slice(0, n)], [[label, ...vals.map(fmt)]]);

GEN[2].push(() => { // 편차
  const n = 5, { c, dv, M, d } = dataSet(n), i = R(0, n - 1), give = Math.random() < .5, ans = dv[i];
  return mkN(`학생 5명의 ${c.t}${josa(c.t, '이', '가')} 다음과 같다. ${give ? `평균이 ${M}${c.u}일 때, ` : ''}학생 ${NAMES[i]}의 편차는?${dTable(n, `${c.t}(${c.u})`, d)}`, ans, [-ans, d[i], ans + 1, ans - 1, d[i] - median(d) === ans ? ans + 2 : d[i] - median(d)],
    `${give ? '' : `평균 = ${sum(d)} ÷ 5 = ${M}. `}편차 = (변량) − (평균) = ${d[i]} − ${M} = ${fmt(ans)}. 평균보다 크면 양수, 작으면 음수!`, { unit: c.u });
});
GEN[2].push(() => { // 편차의 합 = 0

function fresh(name) { return { v: 1, name, lv: 1, exp: 0, coins: 100, atk: 20, maxHp: 100, time: 0, crit: 10, hints: 2, pets: [], pet: null, pos: null, tut: false, chests: [], seen: '', mapv: 3, crystals: [], dex: [], beaten: [], rival: {}, rivalName: '', cleared: {}, badges: [], wrong: [], st: { ok: 0, total: 0, best: 0 }, daily: { d: '', n: 0, got: false } }; }

function load() { try { const o = JSON.parse(localStorage.getItem(SAVE_KEY)); return o && o.v === 1 ? o : null; } catch (e) { return null; } }
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function daily() { if (S.daily.d !== today()) S.daily = { d: today(), n: 0, got: false }; return S.daily; }
const need = lv => 40 + lv * 20;
const pet = () => PETS.find(p => p.id === S.pet);
const fx = k => (pet() && pet().fx[k]) || 0;
const ATK = () => Math.round(S.atk * (1 + fx('atk') / 100));
const MAXHP = () => S.maxHp + fx('hp');
const TLIM = () => 40 + S.time + fx('time');
const CRIT = () => Math.min(60, S.crit + fx('crit'));

function toast(t) { let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); } const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = t; box.appendChild(el); setTimeout(() => el.remove(), 2200); }
function badge(id) { if (S.badges.includes(id)) return; S.badges.push(id); const b = BADGES[id]; setTimeout(() => toast(`${b[0]} 배지 획득! <b>${b[1]}</b>`), 400); }
function gainExp(n) {
  S.exp += n; let up = false;
  while (S.exp >= need(S.lv)) { S.exp -= need(S.lv); S.lv++; S.atk += 3; S.maxHp += 10; up = true; }
  if (up) { SND.play('lvl', .6); toast(`⭐ 레벨 업! Lv.${S.lv} (공격력 +3, 체력 +10)`); if (S.lv >= 10) badge('lv10'); }
}
function modal(html) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card">${html}</div>`; document.body.appendChild(m); return m; }
function ask(text, yes = '네', no = '아니요') {
  return new Promise(res => { const m = modal(`<p style="text-align:center;font-weight:700">${text}</p><div class="row2"><button class="btn sec" style="color:var(--ink);background:#eee;box-shadow:0 4px 0 #ccc" data-n>${no}</button><button class="btn red" data-y>${yes}</button></div>`);
    m.querySelector('[data-y]').onclick = () => { m.remove(); res(true); }; m.querySelector('[data-n]').onclick = () => { m.remove(); res(false); }; });
}

function fbx() {

    if (window.FBX) return res(window.FBX); if (window.FBX_ERR) return rej(new Error(window.FBX_ERR));
    const t = setTimeout(() => rej(new Error('Firebase 연결 시간이 초과됐어요')), 15000);
    addEventListener('fbx-ready', () => { clearTimeout(t); res(window.FBX); }, { once: true });
    addEventListener('fbx-error', () => { clearTimeout(t); rej(new Error(window.FBX_ERR)); }, { once: true });
  });
}
async function fbUid() { const F = await fbx(); if (F.auth.authStateReady) await F.auth.authStateReady(); if (!F.auth.currentUser) await F.signIn(); return F.auth.currentUser.uid; }

let syncTimer = 0, syncWarned = false;
function syncSoon(ms = 2500) { if (!S || !S.room) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow().catch(() => { }), ms); }
async function syncNow(strict) {
  if (!S || !S.room) return;
  try {
    const F = await fbx(), uid = await fbUid(), z = S.pos ? zoneAt(S.pos.y, S.pos.x) : null;
    await F.S.setDoc(F.S.doc(F.db, 'statquestRooms', S.room.pin, 'players', uid), {

      cleared: [1, 2, 3, 4].filter(i => S.cleared[i]), ok: S.st.ok, total: S.st.total, best: S.st.best, su: S.su || {},

    <span>⏳ 제한 시간</span><b>${TLIM()}초</b><span>🎯 치명타 확률</span><b>${CRIT()}%</b><span>💡 힌트</span><b>${S.hints}개</b><span>🐾 함께하는 펫</span><b>${p ? p.e + ' ' + p.n : '없음'}</b>
    <span>✅ 정답 / 전체</span><b>${S.st.ok} / ${S.st.total} (${rate}%)</b><span>🔥 최고 콤보</span><b>${S.st.best}</b></div></div>
  <button class="btn red" id="reset" style="width:100%;margin-top:14px">처음부터 다시 하기</button></div>`;
  $('#bk').onclick = world;
  $('#reset').onclick = async () => { if (await ask('모든 기록을 지우고 처음부터 할까요?<br>되돌릴 수 없어요!', '모두 지우기')) { S = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) { } titleScreen(); } };
  window.scrollTo(0, 0);
}
// ---------- 저장 코드 ----------
const enc = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s = ''; b.forEach(x => s += String.fromCharCode(x)); return 'SQ1-' + btoa(s); };
const dec = t => { t = t.trim().replace(/^SQ1-/, ''); const s = atob(t), b = Uint8Array.from(s, c => c.charCodeAt(0)); const o = JSON.parse(new TextDecoder().decode(b)); if (!o || o.v !== 1 || !o.name) throw 0; return o; };
function codePage() {
  const slim = { ...S, wrong: [] }, code = enc(slim);
  app.innerHTML = `<div class="page"><button class="back" id="bk">← 돌아가기</button><h2>💾 저장 코드</h2>
  <div class="card"><p style="margin-top:0"><b>① 내 기록 내보내기</b><br><span style="font-size:14px;color:var(--sub)">아래 코드를 복사해서 카톡 나에게 보내기나 메모장에 보관하세요. (오답 노트는 빠져요)</span></p>
    <textarea readonly id="out">${code}</textarea><button class="btn" id="cp" style="width:100%;margin-top:8px">📋 코드 복사</button></div>
  <div class="card" style="margin-top:12px"><p style="margin-top:0"><b>② 다른 기기에서 불러오기</b><br><span style="font-size:14px;color:var(--sub)">복사해 둔 코드를 붙여 넣고 [불러오기]를 누르세요. 지금 기록은 덮어써져요.</span></p>
    <textarea id="in" placeholder="SQ1-로 시작하는 코드를 붙여 넣으세요"></textarea><button class="btn" id="ld" style="width:100%;margin-top:8px">불러오기</button></div></div>`;
  $('#bk').onclick = world;
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(code); toast('복사했어요!'); } catch (e) { const t = $('#out'); t.focus(); t.select(); try { document.execCommand('copy'); toast('복사했어요!'); } catch (e2) { toast('코드를 길게 눌러 직접 복사해 주세요'); } } };
  $('#ld').onclick = async () => { let o; try { o = dec($('#in').value); } catch (e) { return toast('코드가 올바르지 않아요'); }
    if (await ask(`<b>${esc(o.name)}</b> (Lv.${o.lv}) 기록을 불러올까요?<br>지금 기록은 덮어써져요.`, '불러오기')) { S = Object.assign(fresh(o.name), o); save(); toast('불러왔어요!'); world(); } };
  window.scrollTo(0, 0);
}
// 키보드: 1~4 보기 선택, Enter 다음
document.addEventListener('keydown', e => {
  if (!B || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (!B.lock && /^[1-4]$/.test(e.key)) { const el = $(`.opt[data-i="${+e.key - 1}"]`); if (el && !el.classList.contains('gone')) answer(+e.key - 1); }
  else if (B.lock && e.key === 'Enter' && $('#nx')) $('#nx').click();
});
if (PIN_Q && !(S && S.room && S.room.pin === PIN_Q)) joinPage(PIN_Q); else titleScreen();
</script>
<script type="module">
// Firebase 연결: 같은 폴더(또는 avg-game 저장소)의 firebase-config.js 를 찾아서 씁니다.
try {
  const V = 'https://www.gstatic.com/firebasejs/11.10.0/';
  const [A, Au, St] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  let cfg = null;
  for (const p of ['./firebase-config.js', '../firebase-config.js', '/avg-game/firebase-config.js']) { try { cfg = (await import(p)).firebaseConfig; if (cfg && cfg.apiKey) break; } catch (e) { } }
  if (!cfg || !cfg.apiKey) throw new Error('firebase-config.js를 찾지 못했어요');
  const app = A.initializeApp(cfg, 'statquest'), auth = Au.getAuth(app), db = St.getFirestore(app);
  window.FBX = { auth, db, S: St, signIn: () => Au.signInAnonymously(auth) };
  window.dispatchEvent(new Event('fbx-ready'));
} catch (e) { window.FBX_ERR = (e && e.message) || 'Firebase 연결 실패'; window.dispatchEvent(new Event('fbx-error')); }
</script>
